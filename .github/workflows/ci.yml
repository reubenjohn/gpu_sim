name: ci
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run prek run --all-files --show-diff-on-failure
      - run: uv run pytest -q

[project]
name = "gpu-sim"
version = "0.1.0"
description = "100% GPU-resident simulation and RL engine for a GTX 1070 (Pascal SM61)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gpu-sim = "gpu_sim:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.5.10",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs the GTX 1070, nvcc and gcc (CUPTI counter); skipped when any is missing"]
